---
# Codacy repository configuration.
# Scope two engines OFF a single, security-reviewed file. All other Codacy
# engines (Bandit, Ruff, Prospector, Pylint, duplication, metric) continue
# to analyze it normally — this is targeted, not a blanket file exclusion.
#
# scripts/mcp/antigravity_delegate.py is the Antigravity MCP delegate shim
# (fw-adr-0027). Two Codacy findings on it are confirmed false positives:
#   - opengrep (Semgrep successor): "dangerous-subprocess-use-audit" on the
#     os.execvp call. No-shell argv invocation is the REQUIRED injection-safe
#     spawn pattern (fw-adr-0027 §3a R1; CWE-88 prevention; security-engineer
#     approved). Codacy's opengrep wrapper does not honor inline # nosemgrep.
#   - lizard: cyclomatic-complexity > 8 on _read_until_done, a select/read
#     loop already factored into helpers and reviewed; Codacy's limit (8) is
#     stricter than the project's pylint config (file rates pylint 10/10).
#
# .opencode/plugin/hook-bridge.js and tests/hooks/lib/opencode-bridge-
# invoke.mjs are the OpenCode enforcement hook bridge and its live-invoke
# test harness (fw-adr-0031-opencode-hook-bridge.md). Both are pure Node
# ESM with no build step and no project-local Biome/PMD config file, so
# Codacy runs those two engines against its own defaults rather than this
# project's conventions. This is a WHOLE-FILE, per-engine exclusion (same
# shape as the antigravity_delegate.py block above) -- .codacy.yaml has no
# rule-scoped exclusion mechanism, only path-scoped, so this also silences
# Biome/PMD on any FUTURE change to these two files, not just the findings
# below. Revisit narrower if Codacy Cloud ever supports a rule-scoped
# exclusion, or move the two genuinely-irrelevant rules (noNodejsModules,
# noPrototypeBuiltins) to a repo-wide Cloud pattern disable instead -- a
# coding-standard-level decision, out of scope for a single PR. Confirmed
# false positives on these two files:
#   - Biome noNodejsModules (7 hits: hook-bridge.js:54-57 `node:child_process`
#     / `node:fs` / `node:path` / `node:url`; opencode-bridge-invoke.mjs:
#     53-55 `node:fs` / `node:url` / `node:path`). This rule targets
#     browser-only code; both files are Node.js-only OpenCode plugin / test-
#     harness code, and FW-ADR-0031 requires the plugin be a dependency-
#     free ESM module using only node:* builtins -- removing these imports
#     is not an option.
#   - Biome noPrototypeBuiltins (1 hit, hook-bridge.js:372 as of this PR --
#     `Object.prototype.hasOwnProperty.call(source, openCodeKey)`). This is
#     the rule's OWN documented recommended fix for calling hasOwnProperty
#     safely on an object of unknown shape; flagging its own suggested
#     replacement is the false positive.
#   - Biome noAwaitInLoops (2 hits, after refactor -- a third instance,
#     runSessionStartSet's script loop, had no ordering dependency and was
#     fixed for real by switching it to Promise.all instead of excepted):
#       - hook-bridge.js's tool.execute.before guard-chain loop: the
#         PreToolUse guard chain MUST run sequentially -- first-deny-wins
#         ordering is binding per FW-ADR-0031 and is asserted by
#         test-opencode-hook-bridge.sh using a PATH-shimmed python3 with
#         call-count assertions (parallelizing would let a later guard's
#         subprocess spawn even after an earlier one denied, breaking that
#         contract). The code already carries an `eslint-disable-next-line
#         no-await-in-loop` comment recording this; Biome does not read
#         ESLint's suppression syntax.
#       - opencode-bridge-invoke.mjs's main() step-replay loop: steps must
#         replay in the SAME order a real OpenCode session would fire them,
#         because per-session state (sessionParent / sessionAgent /
#         handledIdleSessions) accumulates across steps in the bridge's
#         closure -- see that file's own header comment. Also already
#         carries an `eslint-disable-next-line no-await-in-loop` comment.
#     A file-level exclusion is used here (not an inline `// biome-ignore`
#     comment) because it is already required for the other two Biome
#     rules on these same two files above, so it is not an incremental
#     cost, and because its Codacy-wrapper behavior is PROVEN (this same
#     mechanism is what makes the antigravity_delegate.py exclusion above
#     work) -- unlike an inline `// biome-ignore`, whose Codacy-wrapper
#     support is unverified for Biome (the opengrep precedent above shows
#     the analogous native inline suppression, `# nosemgrep`, is NOT
#     honored by Codacy's wrapper for that engine).
#   - PMD AvoidTrailingComma (5 hits, hook-bridge.js:99, 105, 132, 167,
#     1429). PMD's ecmascript ruleset targets ES3/5, where a trailing
#     comma in an object/array literal was an IE8-and-earlier parse error.
#     Valid syntax since ES5 (object/array literals) and standard project
#     style throughout this codebase. PMD's reported `lineText` is the
#     literal's OPENING line (e.g. "const scripts = ["), not the line with
#     the actual trailing comma -- a tool-reporting artifact, not evidence
#     the finding is about something else.
#
# tests/hooks/test-opencode-hook-bridge.sh:470 (Opengrep
# unquoted-variable-expansion-in-command on `$entries_tsv`): the expansion
# is INSIDE A HEREDOC BODY (`done <<EOF` / `$entries_tsv` / `EOF`), not in
# command position. Heredoc bodies are not word-split by the shell, so
# there is nothing for this rule to protect against here -- a tool false
# positive on a bash construct opengrep's analyzer does not special-case.
# Verified by inspection at the reported line (tests/hooks/
# test-opencode-hook-bridge.sh:435-471).
#
# .opencode/plugin/hook-bridge.js also carries a Lizard file-nloc-medium
# finding (whole-file non-comment-line-of-code count over Codacy's
# threshold). NOT a false positive -- the file is genuinely large -- but
# an ACCEPTED, architecturally-forced trade-off: FW-ADR-0031 requires the
# plugin stay a single dependency-free file OpenCode can load directly
# with no build step and no `npm install` (see this file's own header
# comment), so splitting it into modules to shrink the file-level metric
# is off the table. Every function in the file was independently reduced
# below Codacy's per-function CCN/NLOC thresholds as part of this same
# change (see the Biome exclusion above's noAwaitInLoops note and the PR
# history) -- the remaining file-level count is the sum of many small,
# individually-simple, individually-tested functions, not one more thing
# to shrink. Would become a real finding again if a single function's own
# complexity grows past its per-function threshold, or if the file grows
# from adding NEW guard/lifecycle behavior rather than from the existing
# behavior being reorganized.
engines:
  opengrep:
    exclude_paths:
      - "scripts/mcp/antigravity_delegate.py"
      - "tests/hooks/test-opencode-hook-bridge.sh"
  lizard:
    exclude_paths:
      - "scripts/mcp/antigravity_delegate.py"
      - ".opencode/plugin/hook-bridge.js"
  biome:
    exclude_paths:
      - ".opencode/plugin/hook-bridge.js"
      - "tests/hooks/lib/opencode-bridge-invoke.mjs"
  pmd:
    exclude_paths:
      - ".opencode/plugin/hook-bridge.js"
